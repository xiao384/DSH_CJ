# DSH bundle patch for this plugin.
#
# When developing locally (scratch plugin), point `name` at the ABSOLUTE path of
# the entry .ts file, e.g.:
#   insert:
#     - id: dsh-qq-browser-bridge
#       name: /abs/path/to/dsh-qq-browser-bridge/plugin/src/index.ts
#
# When installed as a published bundle via `dsh plugin --profile <name> add <repo>`,
# DSH registers it from node_modules automatically; you normally don't edit this.
insert:
  - id: dsh-qq-browser-bridge
    name: ./src/index.ts
